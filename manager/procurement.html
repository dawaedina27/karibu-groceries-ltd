<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produce Procurement</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<h2>Produce Procurement (Manager)</h2>

<form>
    <label>Produce Name</label>
    <input type="text" pattern="[A-Za-z0-9 ]+" required>

    <label>Produce Type</label>
    <input type="text" pattern="[A-Za-z ]{2,}" required>

    <label>Date</label>
    <input type="date" required>

    <label>Time</label>
    <input type="time" required>

    <label>Tonnage (kg)</label>
    <input type="number" min="1000" required>

    <label>Cost (UGX)</label>
    <input type="number" min="10000" required>

    <label>Dealer Name</label>
    <input type="text" minlength="2" required>

    <label>Branch</label>
    <select required>
        <option>Branch A</option>
        <option>Branch B</option>
    </select>

    <label>Dealer Contact</label>
    <input type="tel" pattern="07[0-9]{8}" required>

    <label>Selling Price</label>
    <input type="number" min="10000" required>

    <button type="submit">Save</button>
</form>

</body>
</html>
